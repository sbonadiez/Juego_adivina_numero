<!DOCTYPE html>
<html>
<head>
  <title>Adivina el Número</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 60px auto; text-align: center; }
    input { font-size: 20px; padding: 8px; width: 100px; text-align: center; }
    button { font-size: 20px; padding: 8px 20px; margin-left: 10px; cursor: pointer; }
    #message { font-size: 22px; margin-top: 20px; min-height: 40px; }
    #attempts { color: #666; }
  </style>
</head>
<body>
  <h1>🎲 Adivina el Número</h1>
  <p>Estoy pensando un número entre 1 y 100</p>
  <input type="number" id="guessInput" min="1" max="100" placeholder="?">
  <button onclick="makeGuess()">Adivinar</button>
  <p id="message"></p>
  <p id="attempts"></p>

  <script>
    async function makeGuess() {
      const guess = document.getElementById('guessInput').value;
      const res = await fetch('/api/guess', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ guess }),
      });
      const data = await res.json();
      document.getElementById('message').innerText = data.message || data.error;
      document.getElementById('attempts').innerText = data.attempts ? `Intentos: ${data.attempts}` : '';
      document.getElementById('guessInput').value = '';
      document.getElementById('guessInput').focus();
    }
    document.getElementById('guessInput').addEventListener('keypress', e => {
      if (e.key === 'Enter') makeGuess();
    });
  </script>
</body>
</html>
